from pathlib import Path
import textwrap

p = Path("/mnt/data/OooSquareCrawl-Phone-Build-Workflow.yml")
p.write_text(textwrap.dedent("""\
name: Build Ooo Square Crawl

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q OooSquareCrawl-Android-Project.zip
          cd OooSquareCrawl-Android
          test -f app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd OooSquareCrawl-Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ooo-Square-Crawl-APK
          path: OooSquareCrawl-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
"""))

print(f"Created {p} ({p.stat().st_size:,} bytes)")
